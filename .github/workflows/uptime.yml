# پایش بیرون از سرور (D-020): هر ۵ دقیقه نشانی‌های سلامت از بیرون ایران چک می‌شوند و قطعی در بله خبر داده می‌شود.
# وضعیت قبلی در کش Actions می‌ماند تا فقط «قطع شد» و «وصل شد» پیام شوند، نه هر ۵ دقیقه.
# رازها (اختیاری): BALE_TOKEN و BALE_CHAT_ID در Settings → Secrets → Actions همین ریپو. بی‌آن‌ها خبر قطعی با ایمیل شکست اجرای گیت‌هاب می‌رسد.
name: uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: uptime
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - name: Check
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TARGETS="https://bazsazizoroof.faratalent.ir/api/health https://jadoo-teflon.bazsazizoroof.faratalent.ir/panel/login https://faratalent.ir/"
          check() { curl -fsS -o /dev/null -m 20 --retry 2 --retry-delay 20 --retry-all-errors "$1"; }
          down=""
          for url in $TARGETS; do check "$url" || down="$down $url"; done
          mkdir -p state
          before=$(cat state/down 2>/dev/null || true)
          echo "$down" > state/down
          send() { curl -s -m 20 -o /dev/null "https://tapi.bale.ai/bot$BALE_TOKEN/sendMessage" --data-urlencode "chat_id=$BALE_CHAT_ID" --data-urlencode "text=$1" || echo "bale unreachable"; }
          now=$(TZ=Asia/Tehran date '+%F %H:%M')
          echo "down:${down:- none}"
          # بی‌بله هم خبر می‌رسد: اجرایی که قطعی تازه دید شکست می‌خورد و گیت‌هاب به صاحب ریپو ایمیل می‌زند
          if [ -n "$down" ] && [ "$down" != "$before" ]; then
            [ -n "$BALE_TOKEN" ] && send "🔴 قطعی ($now تهران) از بیرون سرور:$down"
            echo "::error::down:$down"; exit 1
          fi
          if [ -z "$down" ] && [ -n "$(echo $before)" ] && [ -n "$BALE_TOKEN" ]; then send "🟢 دوباره در دسترس ($now تهران):$before"; fi
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
